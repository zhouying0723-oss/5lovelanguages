<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="20 道情境二选一，看见你喜欢如何被爱，也看见你习惯如何去爱。" />
    <meta name="theme-color" content="#fffaf4" />
    <title>爱的五种语言｜双向关系自测</title>
  </head>
  <body>
    <button id="music-toggle" class="music-toggle" type="button" aria-label="播放背景音乐" title="播放背景音乐"><span>♫</span><i></i></button>
    <audio id="bgm" src="/5lovelanguages/bgm.m4a" loop preload="metadata"></audio>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
    <script>
      (() => {
        const audio = document.getElementById("bgm");
        const button = document.getElementById("music-toggle");
        audio.volume = 0.35;
        let enabled = localStorage.getItem("love-language-bgm") !== "off";
        const render = () => {
          button.classList.toggle("playing", enabled && !audio.paused);
          button.classList.toggle("muted", !enabled);
          button.setAttribute("aria-label", enabled && !audio.paused ? "关闭背景音乐" : "播放背景音乐");
          button.title = enabled && !audio.paused ? "关闭背景音乐" : "播放背景音乐";
        };
        const start = () => {
          if (!enabled || !audio.paused) return;
          audio.play().then(render).catch(() => undefined);
        };
        const startOnInteraction = event => {
          if (event.target.closest("#music-toggle")) return;
          start();
          if (!audio.paused) document.removeEventListener("pointerdown", startOnInteraction, true);
        };
        document.addEventListener("pointerdown", startOnInteraction, true);
        button.addEventListener("click", event => {
          event.stopPropagation();
          if (!audio.paused) {
            enabled = false;
            audio.pause();
            localStorage.setItem("love-language-bgm", "off");
          } else {
            enabled = true;
            localStorage.setItem("love-language-bgm", "on");
            audio.play().catch(() => undefined);
          }
          render();
        });
        audio.addEventListener("play", render);
        audio.addEventListener("pause", render);
        render();
      })();
    </script>
  </body>
</html>
